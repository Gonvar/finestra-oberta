name: Dades del Govern i del Parlament

# Cada dia torna a llegir les fonts oficials i, si la composició ha canviat, obre una pull request
# que s'integra sola quan la CI passa. main està protegida i no accepta pushes directes de les Actions.
# Si una font falla o una comprovació no quadra, src/dades.ts surt amb un error: la tasca falla i
# GitHub ho notifica, i les dades publicades es queden com estaven.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dades
  cancel-in-progress: false

jobs:
  actualitza:
    name: Actualitza dades/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dades
      - run: npx prettier --write dades/
      - name: Desa els canvis
        run: |
          git add dades/
          # data_consulta canvia cada dia. Si és l'únic que ha canviat, no hi ha res de nou per desar.
          if git diff --cached --quiet -I '"data_consulta"'; then
            echo "La composició no ha canviat."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCA"
          git commit -m "$TITOL"
          git push --force origin "$BRANCA"
          if [ -z "$(gh pr list --head "$BRANCA" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCA" --title "$TITOL" --label dades \
              --body "Actualització automàtica des de les fonts oficials. La genera el workflow de dades."
          fi
          # Les pull requests obertes amb GITHUB_TOKEN no disparen la CI, però workflow_dispatch sí.
          gh workflow run ci.yml --ref "$BRANCA"
          gh pr merge "$BRANCA" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCA: dades/actualitzacio
          TITOL: 'chore(dades): actualitza el Govern i el Parlament'
