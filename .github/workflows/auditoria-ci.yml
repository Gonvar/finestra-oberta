name: Auditoria temporal de la CI
on:
  push:
    branches: [claude/project-thread-gts3cq]
    paths: ['.github/workflows/auditoria-ci.yml']
permissions:
  actions: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > a.mjs <<'JS'
          const api = async (p) => { const r = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}${p}`, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' } }); if (!r.ok) throw new Error(`${p} ${r.status}`); return r.json(); };
          const runs = [];
          for (let page = 1; runs.length < 150; page++) { const d = await api(`/actions/runs?per_page=100&page=${page}&status=completed`); if (!d.workflow_runs.length) break; runs.push(...d.workflow_runs.filter(r => !r.path.includes('auditoria'))); }
          const sel = runs.slice(0, 150);
          const t = (s) => new Date(s).getTime() / 1000;
          const rows = [];
          for (const r of sel) {
            const { jobs } = await api(`/actions/runs/${r.id}/jobs?per_page=100&filter=latest`);
            for (const j of jobs) {
              if (!j.started_at || !j.completed_at || j.conclusion === 'skipped') continue;
              const setupNames = /^(Set up job|Run actions\/checkout|Run actions\/setup-node|Run npm ci|Baixa la branca dades|Run actions\/download-artifact)/;
              let setup = 0, running = 0;
              for (const s of j.steps) { if (!s.started_at || !s.completed_at) continue; const d = t(s.completed_at) - t(s.started_at); if (setupNames.test(s.name)) setup += d; else if (!/^(Post |Complete job)/.test(s.name)) running += d; else setup += d; }
              rows.push({ wf: r.name.slice(0, 20), ev: r.event, job: j.name, concl: j.conclusion, wait: t(j.started_at) - t(j.created_at), setup, running, total: t(j.completed_at) - t(j.created_at), billed: Math.ceil((t(j.completed_at) - t(j.started_at)) / 60) });
            }
          }
          const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
          const g = {};
          for (const x of rows) (g[`${x.wf} | ${x.job}`] ??= []).push(x);
          console.log(`Execucions: ${sel.length}, de ${sel.at(-1).created_at} a ${sel[0].created_at}. Jobs: ${rows.length}`);
          console.log('workflow | job | n | espera p50/p95 | preparació p50/p95 | execució p50/p95 | total p50/p95 | minuts facturables | fallades');
          for (const [k, v] of Object.entries(g)) {
            const f = (key) => `${q(v.map(x => x[key]), 0.5).toFixed(0)}/${q(v.map(x => x[key]), 0.95).toFixed(0)}`;
            console.log(`${k} | ${v.length} | ${f('wait')} | ${f('setup')} | ${f('running')} | ${f('total')} | ${v.reduce((a, x) => a + x.billed, 0)} | ${v.filter(x => x.concl !== 'success').length}`);
          }
          const prRuns = sel.filter(r => r.event === 'pull_request');
          const dur = prRuns.map(r => t(r.updated_at) - t(r.created_at));
          console.log(`Resultat d'una PR (CI, de crear a acabar): p50 ${q(dur, .5)} s, p95 ${q(dur, .95)} s, n ${dur.length}`);
          const dies = (t(sel[0].created_at) - t(sel.at(-1).created_at)) / 86400;
          console.log(`Minuts facturables en total: ${rows.reduce((a, x) => a + x.billed, 0)} en ${dies.toFixed(1)} dies`);
          JS
          node a.mjs
