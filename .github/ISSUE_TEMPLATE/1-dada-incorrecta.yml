name: Dada incorrecta
description: Una dada del web o d'un servidor és equivocada, antiga, incompleta o mal explicada, o un text pren partit.
labels: [dades]
body:
  - type: markdown
    attributes:
      value: |
        Gràcies per avisar. Aquest avís és públic: no hi posis dades personals. Pots escriure en castellà o en anglès; et respondrem en català.
  - type: dropdown
    id: on
    attributes:
      label: On l'has vista
      options:
        [
          Al web finestraoberta.cat,
          Al servidor idescat,
          Al servidor dades-obertes,
          Al servidor barcelona,
          En un altre lloc,
        ]
    validations:
      required: true
  - type: input
    id: lloc
    attributes:
      label: Pàgina o pregunta
      description: L'adreça de la pàgina o, si era un assistent, la pregunta que li vas fer.
    validations:
      required: true
  - type: textarea
    id: diu
    attributes:
      label: Què hi diu
    validations:
      required: true
  - type: textarea
    id: correcte
    attributes:
      label: Què hauria de dir
      description: La dada correcta i on l'has trobada. Si pot ser, un enllaç a la web de l'organisme que la publica.
    validations:
      required: true
