version: 2
# Les actualitzacions s'agrupen per setmana perquè una persona sola les pugui revisar.
updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependències]
    schedule:
      interval: weekly
    groups:
      servidors:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /web
    labels: [dependències]
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
    commit-message:
      prefix: chore(web)
  - package-ecosystem: github-actions
    directory: /
    labels: [dependències]
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
